<div class="container-fuid login-container px-5 py-3">
  <div class="login">
    <div class="border rounded-3 shadow-sm p-3 m-1">

  
                <h2 class="text-center">
                  {{title}}
                </h2>
                <p class="text-gray-500">
                  Ingresa a tu cuenta de worklic para continuar
                </p>

                <div class="alert alert-success" *ngIf="status == 'success'">
                    Te has identificado correctamente, bienvenido!!
                </div>
                <div class="alert alert-danger" *ngIf="status == 'error'">
                    Error al iniciar sesión, datos incorrectos.
                </div>

                <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="col-lg-12">
                    <div class="form-group py-2">
                        <label class="form-label">Correo electronico</label>
                        <input type="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" name="email" #email="ngModel" [(ngModel)]="user.email" class="form-control" placeholder="correo@email.com" required />
                        <span *ngIf="!email.valid && email.touched" > El correo electronico no es correcto! </span>
                    </div>
                    <div class="form-group py-2">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" #password="ngModel" [(ngModel)]="user.password" class="form-control" placeholder="********" required />
                        <span *ngIf="!password.valid && password.touched" > La contraseña es obligatoria! </span>
                    </div>

                    <div class="form-group text-left p-0">
                      <a [routerLink]="['']" class="btn btn-link">Olvidaste tu contraseña? </a>
                    </div>

                    <div class="form-group form-check py-2">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Recordar mi sesion</label>
                    </div>
                    <div class="text-center">
                      <input type="submit" value="Ingresar" class="btn btn-primary" [disabled]="!loginForm.form.valid">
                    </div>
                    
                    <div class="text-center">
                      <span>No tienes una cuenta?</span><a [routerLink]="['/register']" class="btn btn-link"> Registrarse </a>
                    </div>
                    
                </form>
    </div>
  </div>
</div>
